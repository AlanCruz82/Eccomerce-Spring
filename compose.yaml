services:
  #Servicio de la aplicacion Spring Boot
  app:
    build: .
    container_name: eccomerce-app
    restart: unless-stopped
    #Espera a que MySQL este sano antes de iniciar la aplicacion
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/eccomerce?serverTimeZone=UTC
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      SERVER_PORT: "8081"
    ports:
      - "8081:8081"
    volumes:
      #Volumen para persistir las imagenes subidas de los productos (/app/uploads/productos)
      - uploads-data:/app/uploads

  #Servicio de base de datos MySQL
  mysql:
    image: mysql:8
    container_name: eccomerce-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: eccomerce
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      #Volumen para persistir la informacion de la base de datos
      - mysql-eccomerce:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  #Datos de MySQL
  mysql-eccomerce:
  #Imagenes subidas de los productos
  uploads-data:
