<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head
        th:replace="~{fragments/layout/header :: header('Carrito')}">
</head>

<body>

<div
        th:replace="~{fragments/layout/navbar :: navbar}">
</div>

<main class="container py-4">

    <div th:replace="~{fragments/comun/mensaje-error :: mensaje-error}"></div>

    <div
            th:replace="~{fragments/comun/navegacion ::
            navegacion(
                null,
                'Mi carrito')}">
    </div>

    <div
            class="row"
            th:unless="${#lists.isEmpty(carrito.items)}">

        <div class="col-lg-8">

            <div th:each="item : ${carrito.items}">
                <div th:replace="~{fragments/carrito/item :: item(${item})}">
                </div>
            </div>

        </div>

        <div class="col-lg-4">

            <div
                    th:replace="~{fragments/carrito/resumen :: resumen(${carrito})}">
            </div>

        </div>

    </div>

</main>

<div
        th:replace="~{fragments/layout/footer :: footer}">
</div>

<div
        th:replace="~{fragments/layout/scripts :: scripts}">
</div>

</body>

</html>
