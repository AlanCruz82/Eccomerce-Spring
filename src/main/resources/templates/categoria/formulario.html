<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout/header :: header('Categorías')}"></head>

<body>

<div th:replace="~{fragments/layout/navbar :: navbar}"></div>

<main class="container py-4">

    <div th:replace="~{fragments/comun/mensaje :: mensaje}"></div>

    <div class="row justify-content-center">
        <div class="col-12 col-md-6">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h3 class="card-title mb-4"
                        th:text="${categoriaId} != null ? 'Editar categoría' : 'Nueva categoría'">
                        Nueva categoría
                    </h3>

                    <form th:action="${categoriaId} != null
                            ? @{/admin/categorias/{id}(id=${categoriaId})}
                            : @{/admin/categorias}"
                          th:object="${categoria}"
                          method="post">

                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text"
                                   id="nombre"
                                   th:field="*{nombre}"
                                   class="form-control"
                                   placeholder="Nombre de la categoría"
                                   required>
                            <div class="text-danger small"
                                 th:if="${#fields.hasErrors('nombre')}"
                                 th:errors="*{nombre}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/categorias}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Guardar
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</main>

<div th:replace="~{fragments/layout/footer :: footer}"></div>

<div th:replace="~{fragments/layout/scripts :: scripts}"></div>

</body>
</html>
