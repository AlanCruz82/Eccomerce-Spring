<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head
        th:replace="~{fragments/layout/header :: header('Checkout')}">
</head>

<body>

<div
        th:replace="~{fragments/layout/navbar :: navbar}">
</div>

<main class="container py-4">

    <div
            th:replace="~{fragments/comun/navegacion ::
            navegacion(
                'Mi carrito',
                'Checkout')}">
    </div>

    <div class="row">

        <div class="col-lg-8">

            <div
                    th:replace="~{fragments/checkout/formulario ::
                    formulario(${checkout})}">
            </div>

        </div>

        <div class="col-lg-4">

            <div
                    th:replace="~{fragments/checkout/resumen ::
                    resumen(${carrito})}">
            </div>

        </div>

    </div>

</main>

<div
        th:replace="~{fragments/layout/footer :: footer}">
</div>

<div
        th:replace="~{fragments/layout/scripts :: scripts}">
</div>

</body>

</html>
