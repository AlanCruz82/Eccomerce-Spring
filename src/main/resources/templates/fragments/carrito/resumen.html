<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="resumen(carrito)">

    <div class="card shadow-sm sticky-top" style="top:90px;">

        <div class="card-header">

            <h5 class="mb-0">

                Resumen de compra

            </h5>

        </div>

        <div class="card-body">

            <div class="d-flex justify-content-between mb-3">

                <span>Productos</span>

                <span th:text="${carrito.cantidadProductos}"></span>

            </div>

            <div class="d-flex justify-content-between mb-3">

                <span>Subtotal</span>

                <span
                        th:text="'$ ' + ${#numbers.formatDecimal(carrito.subtotal,1,'COMMA',2,'POINT')}">
                </span>

            </div>

            <div class="d-flex justify-content-between mb-3">

                <span>Envío</span>

                <span
                        th:text="'$ ' + ${#numbers.formatDecimal(carrito.costoEnvio,1,'COMMA',2,'POINT')}">
                </span>

            </div>

            <hr>

            <div class="d-flex justify-content-between fw-bold fs-5">

                <span>Total</span>

                <span
                        th:text="'$ ' + ${#numbers.formatDecimal(carrito.total,1,'COMMA',2,'POINT')}">
                </span>

            </div>

            <div class="d-grid mt-4">

                <a
                        th:href="@{/checkout}"
                        class="btn btn-success">

                    Continuar compra

                </a>

            </div>

            <div class="d-grid mt-2">

                <form
                        th:action="@{/carrito/vaciar}"
                        method="post">

                    <button
                            class="btn btn-outline-danger w-100">

                        Vaciar carrito

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</html>
