<div xmlns:th="http://www.thymeleaf.org"
     th:fragment="categorias">

    <section>

        <div class="row g-4">

            <div
                    class="col-12 col-md-6 col-lg-3"
                    th:each="categoria : ${categorias}">

                <div
                        th:replace="~{fragments/home/tarjeta_categoria :: tarjeta_categoria(${categoria})}">
                </div>

            </div>

        </div>

    </section>

</div>
