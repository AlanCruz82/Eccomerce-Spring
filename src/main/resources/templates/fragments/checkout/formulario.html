<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="formulario(checkout)">

    <div class="card shadow-sm">

        <div class="card-header">

            <h4 class="mb-0">

                Información de envío

            </h4>

        </div>

        <div class="card-body">

            <form
                    th:action="@{/checkout}"
                    th:object="${checkout}"
                    method="post">

                <div class="mb-3">

                    <label class="form-label">

                        Nombre completo

                    </label>

                    <input
                            class="form-control"
                            th:field="*{nombreCliente}"
                            required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Teléfono

                    </label>

                    <input
                            class="form-control"
                            th:field="*{telefono}"
                            required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Dirección

                    </label>

                    <textarea
                            class="form-control"
                            rows="3"
                            th:field="*{direccionEnvio}"
                            required>
                    </textarea>

                </div>

                <div class="row">

                    <div class="col-md-6">

                        <label class="form-label">

                            Ciudad

                        </label>

                        <input
                                class="form-control"
                                th:field="*{ciudad}"
                                required>

                    </div>

                    <div class="col-md-6">

                        <label class="form-label">

                            Código Postal

                        </label>

                        <input
                                class="form-control"
                                th:field="*{codigoPostal}"
                                required>

                    </div>

                </div>

                <div class="mt-3">

                    <label class="form-label">

                        Referencia (opcional)

                    </label>

                    <textarea
                            class="form-control"
                            rows="2"
                            th:field="*{referencia}">
                    </textarea>

                </div>

                <div class="d-grid mt-4">

                    <button
                            class="btn btn-success btn-lg">

                        Confirmar compra

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</html>
