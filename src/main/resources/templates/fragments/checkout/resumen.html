<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="resumen(carrito)">

    <div class="card shadow-sm sticky-top" style="top:90px;">

        <div class="card-header">

            <h5 class="mb-0">

                Tu pedido

            </h5>

        </div>

        <div class="card-body">

            <div
                    class="d-flex justify-content-between mb-2"
                    th:each="item : ${carrito.items}">

                <span>

                    <span th:text="${item.cantidad}"></span>
                    ×
                    <span th:text="${item.nombre}"></span>

                </span>

                <span
                        th:text="'$ ' + ${#numbers.formatDecimal(item.subtotal,1,'COMMA',2,'POINT')}">
                </span>

            </div>

            <hr>

            <div class="d-flex justify-content-between">

                <span>Subtotal</span>

                <span
                        th:text="'$ ' + ${#numbers.formatDecimal(carrito.subtotal,1,'COMMA',2,'POINT')}">
                </span>

            </div>

            <div class="d-flex justify-content-between mt-2">

                <span>Envío</span>

                <span
                        th:text="'$ ' + ${#numbers.formatDecimal(carrito.costoEnvio,1,'COMMA',2,'POINT')}">
                </span>

            </div>

            <hr>

            <div class="d-flex justify-content-between fs-5 fw-bold">

                <span>Total</span>

                <span
                        th:text="'$ ' + ${#numbers.formatDecimal(carrito.total,1,'COMMA',2,'POINT')}">
                </span>

            </div>

        </div>

    </div>

</div>

</html>
