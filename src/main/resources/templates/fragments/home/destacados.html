<div xmlns:th="http://www.thymeleaf.org"
     th:fragment="destacados">

    <section class="mb-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2>

                Productos destacados

            </h2>

            <a
                    th:href="@{/productos}"
                    class="btn btn-outline-primary">

                Ver todos

            </a>

        </div>

        <div class="row g-4">

            <div
                    class="col-12 col-md-6 col-lg-3"
                    th:each="producto : ${productosDestacados}">

                <div
                        th:replace="~{fragments/producto/tarjeta :: tarjeta(${producto})}">
                </div>

            </div>

        </div>

    </section>

</div>
