<div xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
     th:fragment="tarjeta_categoria(categoria)">

    <div class="card h-100 shadow-sm product-card">

        <div class="card-body text-center">

            <i class="bi bi-grid display-5 text-primary"></i>

            <h5
                    class="mt-3"
                    th:text="${categoria.nombre}">
            </h5>

        </div>

        <div class="card-footer bg-white border-0 d-flex flex-column gap-1">

            <a
                    th:href="@{/productos(categoriaId=${categoria.id})}"
                    class="btn btn-outline-primary w-100">

                Ver productos

            </a>

            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/admin/categorias/{id}/editar(id=${categoria.id})}"
               class="btn btn-outline-warning w-100">
                <i class="bi bi-pencil"></i> Editar
            </a>

        </div>

    </div>

</div>
