<div xmlns:th="http://www.thymeleaf.org"
     th:fragment="ventajas">

    <section class="mb-5">

        <div class="row text-center g-4">

            <div class="col-md-4">

                <div class="card border-0 shadow-sm h-100">

                    <div class="card-body">

                        <i class="bi bi-truck display-4 text-primary"></i>

                        <h4 class="mt-3">

                            Envíos rápidos

                        </h4>

                        <p class="text-muted">

                            Recibe tus productos de forma rápida y segura.

                        </p>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card border-0 shadow-sm h-100">

                    <div class="card-body">

                        <i class="bi bi-shield-lock display-4 text-success"></i>

                        <h4 class="mt-3">

                            Compra segura

                        </h4>

                        <p class="text-muted">

                            Tus datos siempre estarán protegidos.

                        </p>

                    </div>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card border-0 shadow-sm h-100">

                    <div class="card-body">

                        <i class="bi bi-headset display-4 text-warning"></i>

                        <h4 class="mt-3">

                            Soporte

                        </h4>

                        <p class="text-muted">

                            Estamos disponibles para ayudarte cuando lo necesites.

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </section>

</div>
