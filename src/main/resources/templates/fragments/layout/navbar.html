<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

<nav
        th:fragment="navbar"
        class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           th:href="@{/}">

            <i class="bi bi-shop"></i>

            E-Commerce

        </a>

        <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbar">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div
                class="collapse navbar-collapse"
                id="navbar">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/}">

                        <i class="bi bi-house"></i>

                        Inicio

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/productos}">

                        <i class="bi bi-box-seam"></i>

                        Productos

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/categorias}">

                        <i class="bi bi-grid"></i>

                        Categorías

                    </a>

                </li>

                <li class="nav-item">

                    <a class="nav-link"
                       th:href="@{/carrito}">

                        <i class="bi bi-cart3"></i>

                        Carrito

                    </a>

                </li>

            </ul>

            <form
                    class="d-flex me-3"
                    method="get"
                    th:action="@{/productos}">

                <input
                        class="form-control"
                        type="search"
                        name="nombre"
                        placeholder="Buscar productos">

            </form>

            <div sec:authorize="!isAuthenticated()">
                <a class="btn btn-outline-light" th:href="@{/login}">
                    <i class="bi bi-person"></i> Iniciar sesión
                </a>
            </div>
            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                <span class="text-light me-2 small" sec:authentication="name"></span>
                <a class="nav-link text-light px-2" th:href="@{/pedidos}">
                    <i class="bi bi-box"></i> Pedidos
                </a>
                <a sec:authorize="hasRole('ADMIN')" class="nav-link text-light px-2"
                   th:href="@{/admin/pedidos}">
                    <i class="bi bi-speedometer2"></i> Admin
                </a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-right"></i> Salir
                    </button>
                </form>
            </div>

        </div>

    </div>

</nav>

</body>

</html>
