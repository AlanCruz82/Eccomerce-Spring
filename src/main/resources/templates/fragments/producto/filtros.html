<div xmlns:th="http://www.thymeleaf.org"
     th:fragment="filtros">

    <div class="card shadow-sm mb-4">

        <div class="card-header">

            <h5 class="mb-0">

                <i class="bi bi-funnel"></i>

                Filtros

            </h5>

        </div>

        <div class="card-body">

            <form
                    method="get"
                    th:action="@{/productos}">

                <div class="row g-3">

                    <!-- Nombre -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Buscar producto

                        </label>

                        <input
                                type="text"
                                name="nombre"
                                class="form-control"
                                placeholder="Nombre del producto..."
                                th:value="${filtro.nombre}">

                    </div>

                    <!-- Categoría -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Categoría

                        </label>

                        <select
                                name="categoriaId"
                                class="form-select">

                            <option value="">

                                Todas

                            </option>

                            <option
                                    th:each="categoria : ${categorias}"
                                    th:value="${categoria.id}"
                                    th:text="${categoria.nombre}"
                                    th:selected="${categoria.id == filtro.categoriaId}">
                            </option>

                        </select>

                    </div>

                    <!-- Precio mínimo -->

                    <div class="col-md-3">

                        <label class="form-label">

                            Precio mínimo

                        </label>

                        <input
                                type="number"
                                step="0.01"
                                min="0"
                                name="precioMinimo"
                                class="form-control"
                                th:value="${filtro.precioMinimo}">

                    </div>

                    <!-- Precio máximo -->

                    <div class="col-md-3">

                        <label class="form-label">

                            Precio máximo

                        </label>

                        <input
                                type="number"
                                step="0.01"
                                min="0"
                                name="precioMaximo"
                                class="form-control"
                                th:value="${filtro.precioMaximo}">

                    </div>

                    
                    </div>

                    <!-- Botones -->

                    <div class="col-md-3 d-flex align-items-end justify-content-end">

                        <a
                                th:href="@{/productos}"
                                class="btn btn-outline-secondary me-2">

                            Limpiar

                        </a>

                        <button
                                type="submit"
                                class="btn btn-primary">

                            Buscar

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

</div>
