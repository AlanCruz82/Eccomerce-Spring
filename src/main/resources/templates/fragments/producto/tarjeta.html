<div
        xmlns:th="http://www.thymeleaf.org"
        th:fragment="tarjeta(producto)">

    <div class="card product-card h-100 shadow-sm">

        <!-- Imagen -->
        <img
                th:src="@{${producto.urlImagen}}"
                th:alt="${producto.nombre}"
                class="card-img-top product-image">

        <!-- Información -->
        <div class="card-body d-flex flex-column">

            <h5
                    class="card-title"
                    th:text="${producto.nombre}">
            </h5>

            <p
                    class="text-muted mb-2"
                    th:text="${producto.categoria.nombre}">
            </p>

            <p
                    class="product-price"
                    th:text="'$ ' + ${#numbers.formatDecimal(producto.precio,1,'COMMA',2,'POINT')}">
            </p>

            <p>

                <span
                        class="stock-disponible"
                        th:if="${producto.existencia > 0}">

                    <i class="bi bi-check-circle-fill"></i>

                    Disponible

                </span>

                <span
                        class="stock-agotado"
                        th:if="${producto.existencia == 0}">

                    <i class="bi bi-x-circle-fill"></i>

                    Agotado

                </span>

            </p>

            <div class="mt-auto">

                <a
                        class="btn btn-primary w-100"
                        th:href="@{/productos/{id}(id=${producto.id})}">

                    Ver detalle

                </a>

            </div>

        </div>

    </div>

</div>
