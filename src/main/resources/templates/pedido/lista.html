<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout/header :: header('Mis pedidos')}"></head>

<body class="bg-light">

<header th:replace="~{fragments/layout/navbar :: navbar}"></header>

<main class="container py-5">

    <div th:replace="~{fragments/comun/mensaje-error :: mensaje-error}"></div>

    <div th:replace="~{fragments/comun/navegacion ::
            navegacion(
                'Pedidos',
                'Mis pedidos'
            )}">
    </div>

    <div class="mb-5">
        <h1 class="fw-bold" th:text="${esUsuario} ? 'Mis pedidos' : 'Todos los pedidos'"></h1>
        <p class="text-muted" th:text="${esUsuario} ? 'Historial de tus compras realizadas.' : 'Gestión de pedidos realizados.'"></p>
    </div>

    <!-- Filtros (solo admin, cuando estados está presente en el modelo) -->
    <div th:if="${estados != null}" class="card shadow-sm mb-4">
        <div class="card-body">
            <form method="get" th:action="@{/admin/pedidos}" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label for="filtroEstado" class="form-label">Estado</label>
                    <select name="estado" id="filtroEstado" class="form-select">
                        <option value="">Todos los estados</option>
                        <option th:each="e : ${estados}"
                                th:value="${e.name()}"
                                th:text="${e.name()}"
                                th:selected="${e.name() == filtroEstado}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="filtroUsuario" class="form-label">Cliente</label>
                    <select name="usuarioId" id="filtroUsuario" class="form-select">
                        <option value="">Todos los clientes</option>
                        <option th:each="u : ${usuarios}"
                                th:value="${u.id}"
                                th:text="|${u.nombre} (${u.correoElectronico})|"
                                th:selected="${u.id == filtroUsuarioId}"></option>
                    </select>
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-funnel"></i> Filtrar
                    </button>
                    <a th:href="@{/admin/pedidos}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle"></i> Limpiar
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Pedido</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th th:unless="${esUsuario}">Cliente</th>
                            <th class="text-end">Total</th>
                            <th class="text-end">Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="pedido : ${pedidos.content}">
                            <td>
                                <a th:href="@{/pedidos/{id}(id=${pedido.id})}"
                                   class="fw-bold text-decoration-none">
                                    #<span th:text="${pedido.id}"></span>
                                </a>
                            </td>
                            <td th:text="${#temporals.format(pedido.fechaActualizacion, 'dd/MM/yyyy HH:mm')}"></td>
                            <td>
                                <div th:replace="~{fragments/pedido/estado :: estado(${pedido.estado})}"></div>
                            </td>
                            <td th:unless="${esUsuario}">
                                <span th:text="${pedido.usuario.nombre}"></span>
                                <br>
                                <small class="text-muted" th:text="${pedido.usuario.correoElectronico}"></small>
                            </td>
                            <td class="text-end fw-bold">
                                $<span th:text="${pedido.total}"></span>
                            </td>
                            <td class="text-end">
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{/pedidos/{id}(id=${pedido.id})}">
                                    Ver detalle
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${pedidos.content.isEmpty()}">
                            <td colspan="6" class="text-center py-5">
                                <p class="text-muted mb-0" th:text="${esUsuario} ? 'No tienes pedidos registrados.' : 'No hay pedidos registrados.'"></p>
                                <a th:href="@{/productos}" class="btn btn-primary mt-3">
                                    Ir a comprar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <nav th:if="${pedidos.totalPages > 0}"
         th:with="baseUrl=${esUsuario} ? '/pedidos/usuario' : (${estados != null} ? '/admin/pedidos' : '/pedidos')"
         class="mt-4" aria-label="Paginación de pedidos">
        <ul class="pagination justify-content-center">

            <li class="page-item" th:classappend="${pedidos.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{${baseUrl}(pagina=${pedidos.number - 1}, estado=${filtroEstado}, usuarioId=${filtroUsuarioId})}"
                   aria-label="Anterior">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, pedidos.totalPages - 1)}"
                th:classappend="${i == pedidos.number} ? 'active'">
                <a class="page-link"
                   th:href="@{${baseUrl}(pagina=${i}, estado=${filtroEstado}, usuarioId=${filtroUsuarioId})}"
                   th:text="${i + 1}"></a>
            </li>

            <li class="page-item" th:classappend="${pedidos.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{${baseUrl}(pagina=${pedidos.number + 1}, estado=${filtroEstado}, usuarioId=${filtroUsuarioId})}"
                   aria-label="Siguiente">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>

        </ul>
    </nav>

</main>

<footer th:replace="~{fragments/layout/footer :: footer}"></footer>

<div th:replace="~{fragments/layout/scripts :: scripts}"></div>
</body>
</html>
