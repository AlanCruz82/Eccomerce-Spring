<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout/header :: header('Productos')}"></head>

<body>

<div th:replace="~{fragments/layout/navbar :: navbar}"></div>

<main class="container py-4">

    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h3 class="card-title mb-4"
                        th:text="${productoId} != null ? 'Editar producto' : 'Nuevo producto'">
                        Nuevo producto
                    </h3>

                    <form th:action="${productoId} != null
                            ? @{/productos/{id}(id=${productoId})}
                            : @{/productos}"
                          th:object="${producto}"
                          method="post">

                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text"
                                   id="nombre"
                                   th:field="*{nombre}"
                                   class="form-control"
                                   placeholder="Nombre del producto"
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}"
                                 th:errors="*{nombre}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea id="descripcion"
                                      th:field="*{descripcion}"
                                      class="form-control"
                                      rows="3"
                                      placeholder="Descripción del producto"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}"
                                 th:errors="*{descripcion}"></div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="precio" class="form-label">Precio</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number"
                                           id="precio"
                                           th:field="*{precio}"
                                           class="form-control"
                                           step="0.01"
                                           min="0.01"
                                           placeholder="0.00"
                                           required>
                                </div>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('precio')}"
                                     th:errors="*{precio}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="existencia" class="form-label">Existencia</label>
                                <input type="number"
                                       id="existencia"
                                       th:field="*{existencia}"
                                       class="form-control"
                                       min="0"
                                       placeholder="0"
                                       required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('existencia')}"
                                     th:errors="*{existencia}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="urlImagen" class="form-label">URL de imagen</label>
                            <input type="url"
                                   id="urlImagen"
                                   th:field="*{urlImagen}"
                                   class="form-control"
                                   placeholder="https://ejemplo.com/imagen.jpg"
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('urlImagen')}"
                                 th:errors="*{urlImagen}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="idCategoria" class="form-label">Categoría</label>
                            <select id="idCategoria"
                                    th:field="*{idCategoria}"
                                    class="form-select"
                                    required>
                                <option value="">Selecciona una categoría</option>
                                <option th:each="cat : ${categorias}"
                                        th:value="${cat.id}"
                                        th:text="${cat.nombre}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('idCategoria')}"
                                 th:errors="*{idCategoria}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/productos}" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Guardar
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</main>

<div th:replace="~{fragments/layout/footer :: footer}"></div>

<div th:replace="~{fragments/layout/scripts :: scripts}"></div>

</body>
</html>
