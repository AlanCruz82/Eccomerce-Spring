<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout/header :: header('Usuarios')}"></head>
<body>

<div th:replace="~{fragments/layout/navbar :: navbar}"></div>

<main class="container py-4">

    <div th:replace="~{fragments/comun/mensaje-error :: mensaje-error}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-people"></i> Usuarios</h2>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form method="get" th:action="@{/admin/usuarios}" class="row g-3 align-items-end">
                <div class="col-md-6">
                    <label class="form-label">Buscar cliente</label>
                    <input type="text"
                           name="busqueda"
                           class="form-control"
                           placeholder="Nombre o correo del cliente..."
                           th:value="${busqueda}">
                </div>
                <div class="col-md-6">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-search"></i> Buscar
                    </button>
                    <a th:href="@{/admin/usuarios}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle"></i> Limpiar
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="usuario : ${usuarios.content}">
                            <td th:text="${usuario.id}"></td>
                            <td th:text="${usuario.nombre}"></td>
                            <td th:text="${usuario.correoElectronico}"></td>
                            <td th:text="${usuario.telefono}"></td>
                            <td>
                                <span class="badge bg-primary rounded-pill" th:text="${usuario.rol}"></span>
                            </td>
                            <td>
                                <span th:if="${usuario.activo}"
                                      class="badge bg-success rounded-pill">Activo</span>
                                <span th:unless="${usuario.activo}"
                                      class="badge bg-danger rounded-pill">Suspendido</span>
                            </td>
                            <td class="text-end">
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{/admin/usuarios/{id}/editar(id=${usuario.id})}">
                                    <i class="bi bi-pencil"></i> Editar
                                </a>
                                <form th:if="${usuario.activo}" th:action="@{/admin/usuarios/{id}/estado(id=${usuario.id})}"
                                      method="post" class="d-inline">
                                    <input type="hidden" name="activo" value="false">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-person-x"></i> Desactivar
                                    </button>
                                </form>
                                <form th:unless="${usuario.activo}" th:action="@{/admin/usuarios/{id}/estado(id=${usuario.id})}"
                                      method="post" class="d-inline">
                                    <input type="hidden" name="activo" value="true">
                                    <button type="submit" class="btn btn-sm btn-outline-success">
                                        <i class="bi bi-person-check"></i> Activar
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${usuarios.content.isEmpty()}">
                            <td colspan="7" class="text-center py-5">
                                <p class="text-muted mb-0">No hay clientes registrados.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <nav th:if="${usuarios.totalPages > 0}" class="mt-4" aria-label="Paginación de usuarios">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${usuarios.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/usuarios(pagina=${usuarios.number - 1}, busqueda=${busqueda})}"
                   aria-label="Anterior">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, usuarios.totalPages - 1)}"
                th:classappend="${i == usuarios.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/admin/usuarios(pagina=${i}, busqueda=${busqueda})}"
                   th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${usuarios.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/admin/usuarios(pagina=${usuarios.number + 1}, busqueda=${busqueda})}"
                   aria-label="Siguiente">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        </ul>
    </nav>

</main>

<footer th:replace="~{fragments/layout/footer :: footer}"></footer>

<div th:replace="~{fragments/layout/scripts :: scripts}"></div>

</body>
</html>
